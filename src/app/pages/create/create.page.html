
<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar class="toolbar-header-grande">
      <ion-buttons slot="start">
        <ion-button class="boton-volver-grande" (click)="volver()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
      </ion-buttons>
    <p class="header-title-izq">Nuevo Partido</p>
    <ion-buttons slot="end">
      <ion-button color="primary" (click)="siguiente()">
        Siguiente
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div style="margin: 20px 20px 20px;">

    <div class="input-text" style="position: relative;">
      <label>Competición</label>
      <ion-input fill="outline" placeholder="Nombre Competición" [(ngModel)]="partido.competicion" [disabled]="!!partido.competencia_id"></ion-input>
      <p class="aviso-campo-bloqueado" *ngIf="partido.competencia_id">Este partido pertenece a una competencia; para cambiar el nombre, renómbrala desde su pantalla.</p>
    </div>

    <div class="input-text">
      <label>N° Partido</label>
      <ion-input fill="outline" placeholder="Numero Partido" type="number"
        [(ngModel)]="partido.numero_partido"></ion-input>
    </div>

    <div class="input-text">
      <label>Etiqueta</label>
      <ion-input fill="outline" placeholder="Ej: Cuartos de final" [(ngModel)]="partido.etiqueta"></ion-input>
    </div>

    <div class="select-text" *ngIf="gruposDisponibles.length">
      <label>Grupo</label>
      <ion-select fill="outline" interface="popover" label-placement="stacked" [interfaceOptions]="opcionesPopoverSelect" placeholder="Selecciona el grupo"
        [(ngModel)]="partido.grupo_id">
        <ion-select-option [value]="null">Sin grupo</ion-select-option>
        <ion-select-option *ngFor="let grupo of gruposDisponibles" [value]="grupo.id">{{grupo.nombre}}</ion-select-option>
      </ion-select>
    </div>

    <div class="input-text">
      <label>Nro de Sets</label>
      <div class="input-segment">
        <ion-segment class="segment-custom" [(ngModel)]="partido.numero_sets" [disabled]="partidoEnCurso()">
          <ion-segment-button [value]="3">
            <ion-label>3</ion-label>
          </ion-segment-button>
          <ion-segment-button [value]="5">
            <ion-label>5</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>
      <p class="aviso-campo-bloqueado" *ngIf="partidoEnCurso()">Ya se inició este partido, la cantidad de sets no se puede modificar.</p>

    </div>

    <div class="input-text" style="display: flex; align-items: center; justify-content: space-between;">
      <label style="margin: 0;">Cambio de lado último set</label>
      <ion-toggle [(ngModel)]="partido.cambio_lado_ultimo_set"></ion-toggle>
    </div>

    <div class="input-text" style="margin-top: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <label style="margin: 0;">Firmas</label>
        <div>
          <ion-button fill="clear" size="small" (click)="activarTodasLasFirmas()">Activar todo</ion-button>
          <ion-button fill="clear" size="small" (click)="desactivarTodasLasFirmas()">Desactivar todo</ion-button>
        </div>
      </div>
      <div *ngFor="let firma of firmasConfig" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid rgba(var(--ion-color-dark-rgb), 0.1);">
        <label style="margin: 0;">{{firma.label}}</label>
        <ion-toggle [(ngModel)]="partido.firmas_habilitadas[firma.num]"></ion-toggle>
      </div>
    </div>

  </div>

</ion-content>
