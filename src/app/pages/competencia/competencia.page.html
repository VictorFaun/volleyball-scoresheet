<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar class="toolbar-header-grande">
    <ion-buttons slot="start">
      <ion-button class="boton-volver-grande" (click)="volver()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <p class="header-title-izq">{{competencia?.nombre}}</p>
    <ion-buttons slot="end">
      <ion-button class="icon-button-circle" fill="clear" shape="round" (click)="renombrar()"><ion-icon slot="icon-only" name="pencil"></ion-icon></ion-button>
      <ion-button class="icon-button-circle" fill="clear" shape="round" (click)="eliminarCompetencia()"><ion-icon slot="icon-only" name="trash"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="competencia">

  <div style="margin: 16px 20px 0px; display: flex; flex-direction: column; gap: 10px;">
    <div class="card-row" (click)="irAConfiguracion()">
      <ion-icon name="settings-outline"></ion-icon>
      <div class="card-row-texto">
        <p class="card-row-titulo">Configuración</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="card-row-chevron"></ion-icon>
    </div>

    <div class="action-buttons-row">
      <div class="action-button action-button-primary" (click)="nuevoPartido()">
        <ion-icon name="add"></ion-icon>
        <span>Nuevo partido</span>
      </div>
      <div class="action-button" (click)="crearFecha()">
        <ion-icon name="add"></ion-icon>
        <span>Crear fecha</span>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 20px;">

    <div *ngIf="grupos.length">
      <div style="margin-bottom: 10px; font-size: x-large; font-weight: bold;">Fechas</div>
      <ion-item-sliding style="margin-bottom: 10px;" *ngFor="let grupo of grupos">
        <ion-item style="--padding-start:0; --inner-padding-end:0; --background: var(--ion-background-color); --border-width:0; --inner-border-width:0px; --min-height: 0; --border-radius: 14px;">
          <div class="card-row" (click)="irAFecha(grupo.fecha)">
            <div class="card-row-texto">
              <p class="card-row-titulo">{{grupo.fecha.nombre}}</p>
              <p class="card-row-subtitulo">{{grupo.partidos.length}} partido{{grupo.partidos.length === 1 ? '' : 's'}}</p>
            </div>
            <ion-icon name="chevron-forward-outline" class="card-row-chevron"></ion-icon>
          </div>
        </ion-item>
        <ion-item-options side="end" style="border-bottom-width: 0;">
          <ion-item-option (click)="eliminarFecha(grupo.fecha)" color="danger" style="border-radius: 14px;">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </div>

    <div *ngIf="partidosSinFecha.length" [style.margin-top.px]="grupos.length ? 24 : 0">
      <div style="margin-bottom: 10px; font-size: x-large; font-weight: bold;">Partidos</div>
      <app-partido-card
        *ngFor="let partido of partidosSinFecha"
        [partido]="partido"
        (continuar)="continuar_partido(partido.index)"
        (editar)="edit_game(partido.index)"
        (exportar)="exportarPartido(partido.index)"
        (copiar)="copiarPartido(partido.index)"
        (eliminar)="eliminarPartido(partido.index)"
      ></app-partido-card>
    </div>

    <div *ngIf="!grupos.length && !partidosSinFecha.length" style="text-align: center; color: rgba(var(--color-4-rgb), 0.5); margin-top: 24px;">
      Aún no hay partidos en esta competencia.
    </div>

  </div>

</ion-content>
