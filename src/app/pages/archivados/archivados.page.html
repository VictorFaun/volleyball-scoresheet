<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Archivados</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div style="margin: 20px;">
    <p *ngIf="!partidos.length" style="text-align: center; color: rgba(var(--color-4-rgb), 0.5); margin-top: 24px;">
      No hay partidos archivados.
    </p>

    <ion-item *ngFor="let partido of partidos" style="--border-radius:10px; border: 1px solid var(--ion-item-border-color, var(--ion-border-color, var(--ion-color-step-250, var(--ion-background-color-step-250, #c8c7cc)))); margin-bottom: 10px; --inner-padding-end: 8px;">
      <div style="width: 100%; padding: 10px 0;">
        <p style="margin: 0; font-weight: 500;" *ngIf="partido.torneo">{{partido.torneo}}</p>
        <p style="margin: 2px 0 0;">Partido N° {{partido.numero_partido}} &middot; {{partido.equipoA}} vs {{partido.equipoB}}</p>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <ion-button size="small" fill="outline" (click)="restaurar(partido.index)">Restaurar</ion-button>
          <ion-button size="small" fill="clear" color="danger" (click)="eliminarDefinitivo(partido.index)">Eliminar definitivamente</ion-button>
        </div>
      </div>
    </ion-item>
  </div>

</ion-content>
