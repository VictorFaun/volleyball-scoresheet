<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar class="toolbar-header-grande">
    <ion-buttons slot="start">
      <ion-button class="boton-volver-grande" (click)="volver()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <p class="header-title-izq">{{fecha?.nombre}}</p>
    <ion-buttons slot="end">
      <ion-button class="icon-button-circle" fill="clear" shape="round" (click)="renombrar()"><ion-icon slot="icon-only" name="pencil"></ion-icon></ion-button>
      <ion-button class="icon-button-circle" fill="clear" shape="round" (click)="eliminarFecha()"><ion-icon slot="icon-only" name="trash"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="fecha">

  <div style="margin: 16px 20px 0px;">
    <p style="margin: 0 0 12px; color: rgba(var(--color-4-rgb), 0.5);">{{competencia?.nombre}}</p>
    <div class="action-buttons-row">
      <div class="action-button action-button-solido" (click)="nuevoPartido()">
        <ion-icon name="add"></ion-icon>
        <span>Nuevo partido</span>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 20px;">

    <app-partido-card
      *ngFor="let partido of partidos"
      [partido]="partido"
      (continuar)="continuar_partido(partido.index)"
      (editar)="edit_game(partido.index)"
      (exportar)="exportarPartido(partido.index)"
      (copiar)="copiarPartido(partido.index)"
      (eliminar)="eliminarPartido(partido.index)"
    ></app-partido-card>

    <p *ngIf="!partidos.length" style="text-align: center; color: rgba(var(--color-4-rgb), 0.5); margin-top: 24px;">
      Aún no hay partidos en esta fecha.
    </p>

  </div>

</ion-content>
